<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>柴犬探偵団 〜リビングに消ゆ〜</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="柴犬探偵団">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="frame">
    <div id="screen">

      <section id="lobby" aria-label="タイトル">
        <div id="title-art"></div>
        <div class="title-logo">
          <h1><span class="logo" data-text="柴犬探偵団">柴犬探偵団</span><span id="title-icon" aria-hidden="true"></span></h1>
          <p class="subtitle">〜リビングに消ゆ〜</p>
        </div>
        <nav id="title-menu" aria-label="メニュー">
          <button type="button" id="menu-new" aria-label="はじめから">[はじめから]</button>
          <button type="button" id="menu-continue" aria-label="つづきから">[つづきから]</button>
          <button type="button" id="menu-options" aria-label="おぷしょん">[おぷしょん]</button>
        </nav>
        <div id="lobby-body" class="panel" aria-live="polite" hidden></div>
        <p class="press-start" aria-hidden="true">PRESS START BUTTON</p>
        <p class="copyright">© 2026 SHIBA INU DETECTIVE OFFICE</p>
      </section>

      <main id="game" hidden>
        <header id="status">
          <span id="status-location"></span>
          <span id="status-buddy"></span>
          <span id="status-route"></span>
          <button type="button" id="to-title" aria-label="タイトルへもどる">≡</button>
        </header>
        <div id="stage">
          <section id="art" aria-label="場面"></section>
          <section id="dialogue" aria-live="polite"></section>
        </div>
        <footer id="commands">
          <p class="label">【コマンド】</p>
          <ol id="command-list"></ol>
        </footer>
        <aside id="feed" aria-live="polite" aria-label="相棒からの報せ"></aside>
      </main>

    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
